env:
  BACKEND_ENV: "production"
  TEAM_DIRECTORY_PROVIDER: "ldap"
  TEAM_DIRECTORY_URL: "ldaps://ldap.corp.redhat.com"
  TEAM_DIRECTORY_TIMEOUT: "10"
  TEAM_DIRECTORY_VERIFY_SSL: "false"
  TEAM_DIRECTORY_LDAP_USER_BASE_DN: "ou=users,dc=redhat,dc=com"
  TEAM_DIRECTORY_LDAP_GROUP_BASE_DN: ""
  TEAM_DIRECTORY_LDAP_BIND_DN: ""
  TEAM_DIRECTORY_LDAP_BIND_PASSWORD: ""

debug: false

globalConfigMapName: shared-config

replicaCount: 1

image:
   repository: images.paas.redhat.com/unifai/backend
   tag: latest
   pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8005

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: 8005
  periodSeconds: 60

readinessProbe:
  httpGet:
    path: /api/health
    port: 8005
  periodSeconds: 60

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
