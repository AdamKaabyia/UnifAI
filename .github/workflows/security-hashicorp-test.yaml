name: Security Hashicorp Test

env:

  VAULT_URL: ${{ vars.VAULT_URL }}
  APPROLE_NAME: ${{ secrets.APPROLE_NAME }}
  SECRET_ID: ${{ secrets.SECRET_ID }}

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Which branch do you want to use?'
        required: true
        default: 'GENIE-948_hashicorp_integration'
  push:
    branches:
      - GENIE-948_hashicorp_integration

jobs:
  test_hashicorp_vault:
    runs-on: linux
    environment:
      name: ${{ needs.setup_environment.outputs.CLUSTER }}
    env:
      BRANCH: ${{ needs.setup_environment.outputs.BRANCH }}
      CLUSTER: ${{ needs.setup_environment.outputs.CLUSTER }}
      NAMESPACE: ${{ vars.NAMESPACE }}
      VERIFY_TLS: ${{ vars.VERIFY_TLS }}
      API_URL: ${{ vars.API_URL }}
    steps:

      - name: Import Secrets
        id: import-secrets
        uses: hashicorp/vault-action@v2
        with:
            url: ${{ env.VAULT_URL }}
            method: approle
            roleId: ${{ env.APPROLE_NAME }}
            secretId: ${{ env.SECRET_ID }}
            tlsSkipVerify: true
            secrets: |
                apps/automation-and-tools/password password
                apps/automation-and-tools/password password1
                apps/automation-and-tools/test key

      - name: Sensitive Operation
        run: "password1 value '${{ steps.import-secrets.outputs.PASSWORD1 }}'"
