{{- if .Values.reports.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "unifai-tests.fullname" . }}-reports
  labels:
    {{- include "unifai-tests.labels" . | nindent 4 }}
spec:
  type: {{ .Values.reports.service.type }}
  ports:
    - port: {{ .Values.reports.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "unifai-tests.selectorLabels" . | nindent 4 }}
{{- end }}
